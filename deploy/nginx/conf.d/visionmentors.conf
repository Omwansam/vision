map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Re-resolve Docker service names when containers are recreated (avoids stale upstream IPs).
resolver 127.0.0.11 valid=30s ipv6=off;

# Redirect www to apex (HTTP)
server {
    listen 80;
    server_name www.visionmentors.org;

    return 301 https://visionmentors.org$request_uri;
}

# Redirect www to apex (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name www.visionmentors.org;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    return 301 https://visionmentors.org$request_uri;
}

# Public website — visionmentors.org (HTTP)
server {
    listen 80;
    server_name visionmentors.org;

    client_max_body_size 12M;

    location / {
        set $ngo_upstream ngo-website;
        proxy_pass http://$ngo_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# Public website — visionmentors.org (HTTPS — required for Cloudflare Full SSL)
server {
    listen 443 ssl;
    http2 on;
    server_name visionmentors.org;

    ssl_certificate /etc/nginx/ssl/origin.crt;
