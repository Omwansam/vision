# Vision Mentors Group — port 80.
#
# Included into the FIBI edge proxy's http block (see the vhosts-dan mount in
# that stack's compose). FIBI already defines a port-80 server for its own
# domain; without this block a request for visionmentors.org would fall through
# to it as the default server and be redirected to fibicommunity.org.
#
# Kept in a separate file from the HTTPS block on purpose: nginx refuses to
# start when a server block names a certificate that does not exist, so this
# file alone is safe to install before the certificate is on disk.

# Upstreams are addressed by the aliases set in this stack's compose override,
# never by bare service names. Docker's embedded DNS answers a service name with
# every container carrying it, and all three stacks on this host call their API
# service `backend` — an unprefixed name would silently become a round-robin
# pool spanning two applications.
upstream dan_website {
    server dan-website:80;
    keepalive 16;
}

upstream dan_admin {
    server dan-admin:80;
    keepalive 16;
}

upstream dan_backend {
    server dan-backend:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name visionmentors.org www.visionmentors.org admin.visionmentors.org;

    # TLS here is a Cloudflare Origin certificate, so nothing on this host needs
    # an ACME challenge today. Kept anyway: the webroot volume is already mounted
    # in this proxy for the other two tenants, so a later switch to Let's Encrypt
    # needs no change here — and it must never be behind the redirect below,
    # since renewal happens exactly when the current certificate is near expiry.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
