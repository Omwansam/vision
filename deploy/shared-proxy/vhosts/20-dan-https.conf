# Vision Mentors Group — port 443.
#
# Installed only after /etc/letsencrypt/live/visionmentors.org exists: nginx
# refuses to start when a server block names a certificate that is not on disk,
# and this proxy also serves fibicommunity.org and draftbitlabs.tech — so a
# missing file here would take down two sites that have nothing to do with this
# one. Until then it lives in ../vhosts-pending, which nothing includes.
#
# The certificate is issued by deploy/init-letsencrypt.sh's account and renewed
# by the FIBI certbot container, which walks every lineage on the shared
# letsencrypt_certs volume. The proxy reloads itself every 6h to pick renewals
# up, so nothing here needs per-site automation.
#
# Upstreams and the port-80 block are in 10-dan-http.conf.
#
# Inherited from the FIBI http block, deliberately not repeated here:
#   proxy_set_header Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto
#   the auth_limit, api_limit and conn_limit zones
#   resolver, gzip, client_max_body_size
#
# X-Forwarded-For is OVERWRITTEN there rather than appended, and CF-Connecting-IP
# is trusted from Cloudflare's ranges, so the API sees exactly one address and
# its hardcoded `app.set('trust proxy', 1)` is correct.

# www -> apex, so cookies and analytics have a single origin.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.visionmentors.org;

    ssl_certificate     /etc/letsencrypt/live/visionmentors.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionmentors.org/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    return 301 https://visionmentors.org$request_uri;
}

# ------------------------------ Public site ------------------------------- #
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name visionmentors.org;

    ssl_certificate     /etc/letsencrypt/live/visionmentors.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionmentors.org/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    limit_conn conn_limit 50;

    # Login and password reset are the brute-forceable surface, so they get the
    # tighter bucket. Must precede /api/, which would otherwise match first.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://dan_backend;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://dan_backend;
    }

    # Admin-uploaded media, served by Express off the uploads volume.
    location /uploads/ {
        proxy_pass http://dan_backend;
        # Set explicitly rather than with `expires`, which would emit a second
        # Cache-Control header alongside this one.
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Logo and mail artwork. index.js serves these from BACKEND/public, and
    # outbound email builds absolute links against BACKEND_URL — which is this
    # origin, so without this block those images resolve to the SPA's index.html
    # and every notification email ships broken artwork.
    location /branding/ {
        proxy_pass http://dan_backend;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Everything else is the SPA.
    location / {
        proxy_pass http://dan_website;
    }
}

# ------------------------------ Admin console ----------------------------- #
#
# A separate origin from the public site on purpose: the console's token is
# scoped to this host, so the public site can never send it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.visionmentors.org;

    ssl_certificate     /etc/letsencrypt/live/visionmentors.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionmentors.org/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Staff-only. Keep it out of search results entirely.
    add_header X-Robots-Tag              "noindex, nofollow" always;

    limit_conn conn_limit 50;

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://dan_backend;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://dan_backend;
    }

    location /uploads/ {
        proxy_pass http://dan_backend;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /branding/ {
        proxy_pass http://dan_backend;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        proxy_pass http://dan_admin;
    }
}
